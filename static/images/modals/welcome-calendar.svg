  <style>
    .line { fill: none; stroke: #c29a6f; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1; }
    .hatch { stroke-width: .7; opacity: .7; }
    .paper { fill: #ffffff; stroke: #c29a6f; stroke-width: 1.6; stroke-linejoin: round; }
    .shadow { fill: rgba(134, 100, 65, .12); }
    .ring-dot { fill: #c29a6f; }
    .glass { fill: #ffffff; }
    .num { fill: #a67f56; font: 7.5px system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .num.on { fill: #ffffff; font-weight: 600; }
    .done { fill: #7d8b4e; }
    .pending { fill: #c8843c; }
    .spark { fill: #dfbe99; transform-box: fill-box; transform-origin: center; animation: twinkle 2.8s ease-in-out infinite; }
    .spark.late { fill: #e6cba9; animation-delay: 1.4s; }
    @keyframes twinkle { 0%, 100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
