<div class="formset-section" data-formset="{{ formset.prefix }}">
  {{ formset.management_form }}
  <input type="hidden" id="id_{{ formset.prefix }}-errors">
  <span class="invalid-feedback invalid-feedback--custom mb-2 id_{{ formset.prefix }}-errors">
    {{ formset.non_form_errors.0 }}
  </span>
  <p class="formset-empty-message{% if formset.forms %} d-none{% endif %}">{{ empty_label }}</p>
  <div class="formset-rows">
    {% for form in formset %}
    {% include 'common/formset_row.html' %}
    {% endfor %}
  </div>
  <template class="formset-template">
    {% include 'common/formset_row.html' with form=formset.empty_form %}
  </template>
  <button type="button" class="btn btn-sm btn-outline-primary d-inline-flex align-items-center gap-1 formset-add">
    <span class="material-symbols-outlined" aria-hidden="true">add</span>
    {{ add_label }}
  </button>
</div>
