            <div class="table-responsive">
              <table id="{{ field.auto_id }}" class="table table-sm align-middle mb-1 permission-matrix">
                <thead>
                  <tr>
                    <th scope="col">Sección</th>
                    {% for action in permission_actions %}
                    <th scope="col" class="text-center">{{ action }}</th>
                    {% endfor %}
                  </tr>
                </thead>
                <tbody>
                  {% for row in permission_rows %}
                  <tr>
                    <th scope="row" class="fw-normal">{{ row.label }}</th>
                    {% for cell in row.cells %}
                    <td class="text-center">
                      <input class="form-check-input permission-checkbox" type="checkbox" name="{{ field.html_name }}"
                        value="{{ cell.id }}" data-direct="{{ cell.direct|yesno:'1,0' }}"
                        aria-label="{{ cell.action }} {{ row.label|lower }}"
                        {% if cell.direct or cell.inherited %}checked{% endif %}
                        {% if cell.inherited or field.field.disabled %}disabled{% endif %}>
                      <div class="small text-body-secondary inherited-label {% if not cell.inherited %}d-none{% endif %}">
                        por grupo
                      </div>
                    </td>
                    {% endfor %}
                  </tr>
                  {% endfor %}
                </tbody>
              </table>
            </div>
            <span class="invalid-feedback invalid-feedback--custom {{ field.auto_id }}">
              {{ field.errors.0 }}
            </span>
