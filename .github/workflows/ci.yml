name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docker-smoke-test:
    name: Build y arranque de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen de pruebas (target test)
        run: docker build --target test -t nail-salon-backend:ci .

      - name: Levantar PostgreSQL efímero
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_DB=manicuredb \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            --tmpfs /var/lib/postgresql/data \
            postgres:15 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
          for i in $(seq 1 30); do
            docker exec db pg_isready -U postgres && exit 0
            sleep 1
          done
          echo "PostgreSQL no respondió a tiempo" && exit 1

      - name: Arrancar contenedor en modo producción
        run: |
          docker run -d --name web --network ci -p 8000:8000 \
            -e SECRET_KEY=clave-solo-para-ci \
            -e DEBUG=False \
            -e ALLOWED_HOSTS=localhost,127.0.0.1,.localhost \
            -e DATABASE_NAME=manicuredb \
            -e DATABASE_USER=postgres \
            -e DATABASE_PASSWORD=postgres \
            -e DATABASE_HOST=db \
            -e DATABASE_PORT=5432 \
            nail-salon-backend:ci

      - name: Esperar a que gunicorn responda
        run: |
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          echo "Primera respuesta HTTP: $code"
          [ "$code" != "000" ]

      - name: Crear el negocio public y un negocio de prueba
        run: |
          docker exec -i web python manage.py shell <<'PY'
          from apps.tenancy.models import Dominio, Negocio, Persona
          publico = Negocio.objects.create(schema_name="public", nombre="Hi Agenda")
          Dominio.objects.create(domain="localhost", tenant=publico, is_primary=True)
          Dominio.objects.create(domain="admin.localhost", tenant=publico, is_primary=False)
          titular = Persona.objects.create(nombres="Titular de prueba")
          prueba = Negocio.objects.create(schema_name="prueba", nombre="Negocio de prueba", titular=titular, estado="activo")
          prueba.create_schema(check_if_exists=True, verbosity=0)
          Dominio.objects.create(domain="prueba.localhost", tenant=prueba, is_primary=True)
          PY

      - name: Smoke test HTTP (panel solo en admin., raíz sin panel ni agenda, negocio y subdominio inexistente)
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $1" "http://localhost:8000$2")
            echo "$1$2 -> $code (esperado $3)"
            [ "$code" = "$3" ]
          }
          check admin.localhost /admin/login/ 200
          check localhost / 200
          check localhost /admin/login/ 404
          check localhost /clientes/ 404
          check prueba.localhost /inicio_sesion/ 200
          check nadie.localhost /inicio_sesion/ 404

      - name: Migraciones al día con los modelos
        run: docker exec web python manage.py makemigrations --check --dry-run

      - name: Pruebas automáticas
        run: docker exec web python manage.py test --noinput --timing

      - name: Imagen de producción sin la carpeta tests
        run: |
          docker build --target prod -t nail-salon-backend:prod .
          docker run --rm --entrypoint sh nail-salon-backend:prod -c 'test ! -e /app/tests'

      - name: Logs del contenedor (migraciones + gunicorn)
        if: always()
        run: docker logs web

  publicar-imagen:
    name: Publicar imagen en Docker Hub
    needs: docker-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publicar-imagen
      cancel-in-progress: false
    env:
      IMAGEN: docker.io/harinsonarellan/hai-agenda
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
    steps:
      - name: Confirmar que el commit sigue siendo el último de main
        id: vigencia
        run: |
          ultimo=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          echo "Último commit de main: $ultimo · commit de este run: $GITHUB_SHA"
          if [ "$ultimo" = "$GITHUB_SHA" ]; then
            echo "vigente=true" >> "$GITHUB_OUTPUT"
            echo "ETIQUETA=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "Hay un commit más nuevo en main: su propio run publica y despliega."
            echo "vigente=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout del código
        if: steps.vigencia.outputs.vigente == 'true'
        uses: actions/checkout@v4

      - name: Preparar Buildx
        if: steps.vigencia.outputs.vigente == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        if: steps.vigencia.outputs.vigente == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Construir y publicar la imagen de producción (target prod)
        if: steps.vigencia.outputs.vigente == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64
          provenance: false
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ env.ETIQUETA }}
            ${{ env.IMAGEN }}:latest

      - name: Desplegar el web en Render con el commit publicado
        if: steps.vigencia.outputs.vigente == 'true' && env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -G "$RENDER_DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGEN:$ETIQUETA" -o /dev/null

      - name: Desplegar el worker en Render con el commit publicado
        if: steps.vigencia.outputs.vigente == 'true' && env.RENDER_WORKER_DEPLOY_HOOK != ''
        run: curl -fsS -G "$RENDER_WORKER_DEPLOY_HOOK" --data-urlencode "imgURL=$IMAGEN:$ETIQUETA" -o /dev/null
