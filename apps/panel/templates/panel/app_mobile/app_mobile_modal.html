<form id="app-mobile-form-modal" action="{{ modal_url }}" method="post">
  {% csrf_token %}
  <div class="modal-header bg-primary bg-gradient">
    <h5 class="modal-title d-inline-flex align-items-center">
      <span class="material-symbols-outlined icon--title me-2" aria-hidden="true">
        smartphone
      </span>
      <span class="pb-1">Editar app móvil</span>
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    {% for field in form %}
    {% if field.name == 'app_mantenimiento' %}
    <div class="form-check form-switch mt-3 mb-2">
      <label class="form-check-label form-label--custom" for="{{ field.id_for_label }}">
        {{ field.label }}
      </label>
      {{ field }}
      <div class="form-text"><small>{{ field.help_text }}</small></div>
    </div>
    {% else %}
    <div class="mb-2">
      <label for="{{ field.id_for_label }}" class="form-label form-label--custom">
        {{ field.label }}
      </label>
      {{ field }}
      <span class="invalid-feedback invalid-feedback--custom {{ field.id_for_label }}">
        {{ field.errors.0 }}
      </span>
      <div class="form-text"><small>{{ field.help_text }}</small></div>
    </div>
    {% endif %}
    {% endfor %}
  </div>
  <div class="modal-footer modal-footer-soft">
    <button type="button" class="btn btn-sm btn-danger bg-gradient me-2" data-bs-dismiss="modal">
      Cancelar
    </button>
    <button id="app_mobile_submit_btn" type="button" class="btn btn-sm btn-primary bg-gradient">
      Guardar
    </button>
  </div>
</form>
