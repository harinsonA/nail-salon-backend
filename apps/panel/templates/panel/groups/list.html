{% extends 'panel/base.html' %}
{% load static %}

{% block view_title %}
Grupos
{% endblock %}

{% block content %}
<section>
  {% if add_url %}
  <section class="d-inline-flex align-items-center gap-2">
    <a href="{{ add_url }}" class="btn btn-primary btn-sm d-inline-flex align-items-center gap-2" role="button">
      Grupo
      <img src="{% static 'images/common/add.svg' %}" alt="" width="16" height="16">
    </a>
  </section>
  {% endif %}
  <section class="row justify-content-center">
    <div class="col-3">
      <div class="card rounded-4 agenda-card">
        <div class="card-body">
          <h6 class="card-subtitle d-flex text-body-secondary m-0">
            <span>Total de grupos</span>
          </h6>
          <h4 class="card-title text-end text-primary m-0">
            <b id="total_groups_id">0</b>
          </h4>
        </div>
      </div>
    </div>
    <div class="col-3">
      <div class="card rounded-4 agenda-card">
        <div class="card-body">
          <h6 class="card-subtitle d-flex text-body-secondary m-0">
            <span>Con usuarios asignados</span>
          </h6>
          <h4 class="card-title text-end text-primary m-0">
            <b id="groups_with_users_id">0</b>
          </h4>
        </div>
      </div>
    </div>
  </section>
  <section class="mt-3 d-inline-block">
    <div>
      <label class="form-check-label form-label--custom" for="{{ filter_form.users.id_for_label }}">
        {{ filter_form.users.label }}
      </label>
      {{ filter_form.users }}
    </div>
  </section>
  <section class="table-container--custom">
    <table id="groups_table" class="table table-hover">
      <thead>
        <tr>
          <th scope="col">Nombre</th>
          <th scope="col">Permisos</th>
          <th scope="col">Usuarios</th>
          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </section>
</section>
{% endblock %}
{% block extra_js %}
<script>
  $(() => {
    const filterData = {
      users: $('#{{ filter_form.users.id_for_label }}').val(),
    };
    const table = renderDataTable({
      tableID: '#groups_table',
      url: '{{ list_url }}',
      requestData: filterData,
      columns: [
        { data: 'name', className: 'fs-7 w-auto text-nowrap' },
        { data: 'permission_count', className: 'fs-7 w-auto text-center' },
        { data: 'user_count', className: 'fs-7 w-auto text-center' },
        { data: ({ options }) => optionsColumn(options), className: 'all fs-7 w-auto text-center', orderable: false, searchable: false },
      ],
      extraConfig: {
        ajax: {
          dataSrc: (json) => {
            $('#total_groups_id').text(json.total_groups);
            $('#groups_with_users_id').text(json.groups_with_users);
            return json.data;
          },
        },
      },
    });

    $('#{{ filter_form.users.id_for_label }}').on('change', ({ target }) => {
      filterData.users = target.value;
      table.draw();
    });
  });
</script>
{% endblock %}
