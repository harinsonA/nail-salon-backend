<div class="row g-2 align-items-end">
  <div class="col-12 col-sm-8 mb-2">
    <label for="{{ form.numero.id_for_label }}" class="form-label form-label--custom">
      {{ form.numero.label }}
    </label>
    <div class="input-group">
      <div class="input-group-append">
        {{ form.codigo_pais }}
      </div>
      {{ form.numero }}
      <span class="invalid-feedback invalid-feedback--custom {{ form.codigo_pais.id_for_label }}">
        {{ form.codigo_pais.errors.0 }}
      </span>
      <span class="invalid-feedback invalid-feedback--custom {{ form.numero.id_for_label }}">
        {{ form.numero.errors.0 }}
      </span>
    </div>
  </div>
  <div class="col-12 col-sm-4 mb-2">
    {% include 'common/form_field.html' with field=form.tipo %}
  </div>
</div>
<div class="form-check form-switch mb-2">
  <label class="form-check-label form-label--custom" for="{{ form.tiene_whatsapp.id_for_label }}">
    {{ form.tiene_whatsapp.label }}
  </label>
  {{ form.tiene_whatsapp }}
</div>
