{% load static %}
<div id="client-whatsapp-modal">
  <div class="modal-header bg-primary bg-gradient">
    <h5 class="modal-title d-inline-flex align-items-center">
      <img src="{% static 'images/common/whatsapp.svg' %}" alt="" width="22" height="22" class="me-2">
      <span class="pb-1">
        Enviar WhatsApp
      </span>
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <div class="delete-information-container">
      <p class="m-0 py-1 border-bottom d-flex justify-content-between fs-6">
        <b>Cliente</b>
        <span>{{ client_full_name }}</span>
      </p>
      <p class="m-0 py-1 d-flex justify-content-between fs-6">
        <b>Teléfono</b>
        <span>{{ client_phone }}</span>
      </p>
    </div>
    <div class="mb-2">
      <label for="{{ form.message.id_for_label }}" class="form-label form-label--custom">
        {{ form.message.label }}
      </label>
      {{ form.message }}
    </div>
  </div>
  <div class="modal-footer modal-footer-soft">
    <button type="button" class="btn btn-sm btn-danger bg-gradient me-2" data-bs-dismiss="modal">
      Cancelar
    </button>
    <a id="client_whatsapp_btn" href="{{ whatsapp_url }}" data-web-url="{{ whatsapp_web_url }}"
      data-app-url="{{ whatsapp_app_url }}" target="_blank" rel="noopener noreferrer" role="button"
      class="btn btn-sm btn-primary bg-gradient d-inline-flex align-items-center gap-2">
      Abrir WhatsApp
    </a>
  </div>
</div>
<script>
  $(() => {
    const isMobileDevice = () => /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (/Macintosh/i.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

    const messageInput = document.getElementById('{{ form.message.id_for_label }}');
    const whatsappBtn = document.getElementById('client_whatsapp_btn');
    const { webUrl, appUrl } = whatsappBtn.dataset;
    const whatsappUrl = isMobileDevice() ? appUrl : webUrl;
    const separator = whatsappUrl.includes('?') ? '&' : '?';

    const refreshLink = () => {
      const message = messageInput.value.trim();
      whatsappBtn.href = message ? `${whatsappUrl}${separator}text=${encodeURIComponent(message)}` : whatsappUrl;
      whatsappBtn.classList.toggle('disabled', !message);
      whatsappBtn.setAttribute('aria-disabled', String(!message));
    };

    refreshLink();
    messageInput.addEventListener('input', refreshLink);
    whatsappBtn.addEventListener('click', () => $(whatsappBtn).closest('.modal').modal('hide'));
  });
</script>
